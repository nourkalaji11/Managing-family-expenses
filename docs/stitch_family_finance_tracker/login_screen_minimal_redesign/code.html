<!DOCTYPE html>

<html dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>تسجيل الدخول - المصاريف العائلية</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'IBM Plex Sans Arabic', sans-serif;
        }
        .minimal-input {
            transition: all 0.2s ease;
        }
        .minimal-input:focus {
            background-color: white;
            box-shadow: 0 0 0 1px #006c49;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-primary": "#ffffff",
                      "inverse-primary": "#adc6ff",
                      "secondary-container": "#6cf8bb",
                      "inverse-on-surface": "#eaf1ff",
                      "surface-tint": "#005ac2",
                      "secondary-fixed-dim": "#4edea3",
                      "secondary-fixed": "#6ffbbe",
                      "surface-dim": "#cbdbf5",
                      "primary": "#0b1c30", /* Dark Navy primary */
                      "surface-bright": "#f8f9ff",
                      "on-primary-container": "#fefcff",
                      "tertiary": "#825100",
                      "on-error-container": "#93000a",
                      "primary-fixed": "#d8e2ff",
                      "on-secondary-fixed-variant": "#005236",
                      "on-tertiary": "#ffffff",
                      "on-secondary-fixed": "#002113",
                      "on-background": "#0b1c30",
                      "on-tertiary-fixed": "#2a1700",
                      "inverse-surface": "#213145",
                      "surface-container-lowest": "#ffffff",
                      "tertiary-fixed-dim": "#ffb95f",
                      "surface-container-high": "#dce9ff",
                      "on-primary-fixed-variant": "#004395",
                      "error": "#ba1a1a",
                      "primary-container": "#2170e4",
                      "tertiary-container": "#a36700",
                      "surface": "#ffffff",
                      "outline": "#727785",
                      "on-error": "#ffffff",
                      "on-tertiary-container": "#fffbff",
                      "tertiary-fixed": "#ffddb8",
                      "on-tertiary-fixed-variant": "#653e00",
                      "surface-variant": "#f1f3f9",
                      "background": "#ffffff",
                      "surface-container-low": "#f8f9ff",
                      "on-secondary": "#ffffff",
                      "on-surface-variant": "#424754",
                      "primary-fixed-dim": "#adc6ff",
                      "outline-variant": "#c2c6d6",
                      "on-secondary-container": "#00714d",
                      "on-primary-fixed": "#001a42",
                      "error-container": "#ffdad6",
                      "surface-container-highest": "#e1e4ed",
                      "on-surface": "#0b1c30",
                      "surface-container": "#f1f4f9",
                      "secondary": "#006c49" /* Emerald green accent */
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "stack-gap-sm": "0.5rem",
                      "section-margin": "2rem",
                      "stack-gap-md": "1rem",
                      "stack-gap-lg": "1.5rem",
                      "container-padding": "1.25rem"
              },
              "fontFamily": {
                      "headline": ["IBM Plex Sans Arabic"],
                      "display": ["IBM Plex Sans Arabic"],
                      "body": ["IBM Plex Sans Arabic"],
                      "label": ["IBM Plex Sans Arabic"]
              }
            },
          },
        }
    </script>
</head>
<body class="bg-background min-h-screen flex flex-col items-center justify-center p-container-padding relative">
<!-- Main Container -->
<main class="w-full max-w-md z-10 opacity-0 transform translate-y-2 transition-all duration-700 ease-out" id="main-content">
<!-- Brand Header -->
<div class="flex flex-col items-center mb-10">
<div class="w-16 h-16 bg-secondary flex items-center justify-center rounded-2xl mb-6 shadow-lg shadow-secondary/20">
<span class="material-symbols-outlined text-white text-4xl" style="font-variation-settings: 'FILL' 1;">account_balance</span>
</div>
<h1 class="text-3xl font-bold text-primary mb-2 tracking-tight">المصاريف العائلية</h1>
<p class="text-on-surface-variant/70 text-base">إدارة أموال أسرتك بذكاء وسهولة</p>
</div>
<!-- Login Form -->
<div class="bg-white rounded-2xl p-4 md:p-6 border border-outline-variant/30 shadow-sm">
<form action="#" class="space-y-5" method="POST">
<!-- Email Field -->
<div class="space-y-1.5">
<label class="block text-xs font-semibold text-primary/70 pr-1" for="email">البريد الإلكتروني</label>
<div class="relative flex items-center group">
<span class="material-symbols-outlined absolute right-4 text-outline/60 group-focus-within:text-secondary transition-colors duration-300 text-xl">mail</span>
<input class="minimal-input w-full bg-surface-container-low border-transparent focus:border-secondary focus:ring-0 rounded-xl py-3.5 pr-11 pl-4 text-primary placeholder:text-outline/40 outline-none" id="email" name="email" placeholder="example@family.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-1.5">
<div class="flex justify-between items-center mb-1">
<label class="block text-xs font-semibold text-primary/70 pr-1" for="password">كلمة المرور</label>
<a class="text-xs font-bold text-secondary hover:underline" href="#">نسيت كلمة المرور؟</a>
</div>
<div class="relative flex items-center group">
<span class="material-symbols-outlined absolute right-4 text-outline/60 group-focus-within:text-secondary transition-colors duration-300 text-xl">lock</span>
<input class="minimal-input w-full bg-surface-container-low border-transparent focus:border-secondary focus:ring-0 rounded-xl py-3.5 pr-11 pl-11 text-primary placeholder:text-outline/40 outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute left-4 text-outline/40 hover:text-primary transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-xl" id="passIcon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center space-x-2 space-x-reverse py-1">
<input class="w-4 h-4 rounded border-outline-variant/50 text-secondary focus:ring-secondary/20 cursor-pointer transition-all" id="remember" type="checkbox"/>
<label class="text-xs font-medium text-on-surface-variant/80 cursor-pointer select-none" for="remember">تذكرني على هذا الجهاز</label>
</div>
<!-- Login Button -->
<button class="w-full bg-secondary hover:bg-on-secondary-container text-white font-bold text-base py-4 rounded-xl shadow-md shadow-secondary/10 active:scale-[0.98] transition-all duration-300 flex items-center justify-center gap-2 mt-4" type="submit">
<span>تسجيل الدخول</span>
<span class="material-symbols-outlined text-xl">arrow_back</span>
</button>
</form>
<!-- Social Login Alternative -->
<div class="mt-8">
<div class="relative flex items-center mb-5">
<div class="flex-grow border-t border-outline-variant/40"></div>
<span class="flex-shrink mx-4 text-[10px] font-bold text-outline/60 uppercase tracking-widest">أو عبر</span>
<div class="flex-grow border-t border-outline-variant/40"></div>
</div>
<div class="grid grid-cols-2 gap-3">
<button class="flex items-center justify-center py-3 px-4 bg-white border border-outline-variant/60 rounded-xl hover:bg-surface-container-low transition-all gap-2 group">
<svg class="w-4 h-4" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-1 .67-2.28 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.67-.35-1.39-.35-2.09s.13-1.42.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="text-xs font-bold text-primary">جوجل</span>
</button>
<button class="flex items-center justify-center py-3 px-4 bg-white border border-outline-variant/60 rounded-xl hover:bg-surface-container-low transition-all gap-2 group">
<svg class="w-5 h-5 text-[#1877F2]" fill="currentColor" viewbox="0 0 24 24">
<path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"></path>
</svg>
<span class="text-xs font-bold text-primary">فيسبوك</span>
</button>
</div>
</div>
</div>
<!-- Register Link -->
<div class="mt-8 text-center">
<p class="text-sm text-on-surface-variant/70">
            ليس لديك حساب؟ 
            <a class="text-secondary font-bold hover:underline" href="#">سجل الآن مجاناً</a>
</p>
</div>
</main>
<!-- Footer -->
<footer class="mt-auto py-8 flex flex-col items-center opacity-40">
<p class="text-[10px] font-bold text-primary uppercase tracking-widest">جميع الحقوق محفوظة © 2024</p>
<div class="flex items-center gap-1.5 mt-2 text-primary">
<span class="material-symbols-outlined text-sm">verified_user</span>
<span class="text-[10px] font-bold">تشفير بيانات بمعايير مصرفية</span>
</div>
</footer>
<script>
    function togglePassword() {
        const passInput = document.getElementById('password');
        const icon = document.getElementById('passIcon');
        if (passInput.type === 'password') {
            passInput.type = 'text';
            icon.innerText = 'visibility_off';
            icon.parentElement.classList.add('text-secondary');
        } else {
            passInput.type = 'password';
            icon.innerText = 'visibility';
            icon.parentElement.classList.remove('text-secondary');
        }
    }

    // Entrance animation
    window.addEventListener('DOMContentLoaded', () => {
        const main = document.getElementById('main-content');
        setTimeout(() => {
            main.style.opacity = '1';
            main.style.transform = 'translateY(0)';
        }, 100);
    });
</script>
</body></html>
