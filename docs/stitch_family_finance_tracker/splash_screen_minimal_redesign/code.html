<!DOCTYPE html>

<html class="light" dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary": "#001a42", // Dark Navy
                    "on-primary": "#ffffff",
                    "primary-container": "#e5eeff",
                    "on-primary-container": "#001a42",
                    "secondary": "#006c49", // Emerald Green
                    "on-secondary": "#ffffff",
                    "background": "#f8f9ff", // Clean White-ish
                    "on-background": "#0b1c30",
                    "surface": "#ffffff",
                    "on-surface": "#0b1c30",
                    "surface-variant": "#d3e4fe",
                    "on-surface-variant": "#424754",
                    "outline": "#727785",
                    "surface-container-highest": "#d3e4fe",
                    "surface-container": "#e5eeff",
                    "surface-container-low": "#eff4ff",
                    "surface-container-lowest": "#ffffff",
                    "primary-fixed-dim": "#adc6ff",
                    "on-primary-fixed-variant": "#004395"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "stack-gap-sm": "0.5rem",
                    "section-margin": "2rem",
                    "stack-gap-md": "1rem",
                    "stack-gap-lg": "1.5rem",
                    "container-padding": "1.25rem"
            },
            "fontFamily": {
                    "display-lg": ["IBM Plex Sans Arabic"],
                    "headline-md": ["IBM Plex Sans Arabic"],
                    "body-lg": ["IBM Plex Sans Arabic"],
                    "label-md": ["IBM Plex Sans Arabic"],
                    "title-lg": ["IBM Plex Sans Arabic"],
                    "body-md": ["IBM Plex Sans Arabic"]
            },
            "fontSize": {
                    "display-lg": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500"}],
                    "title-lg": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f8f9ff;
            -webkit-tap-highlight-color: transparent;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .gradient-canvas {
            background: linear-gradient(180deg, #f8f9ff 0%, #eff4ff 100%);
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .floating-element {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .shimmer-text {
            color: #001a42;
        }

        .glass-container {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 26, 66, 0.08);
            box-shadow: 0 10px 30px -5px rgba(0, 26, 66, 0.1);
        }

        .loading-bar-container {
            width: 140px;
            height: 4px;
            background-color: #e5eeff;
            border-radius: 999px;
            position: absolute;
            bottom: 80px;
            overflow: hidden;
        }

        .loading-progress {
            width: 40%;
            height: 100%;
            background: #006c49;
            border-radius: 999px;
            animation: progress-move 2.2s infinite cubic-bezier(0.65, 0, 0.35, 1);
        }

        @keyframes progress-move {
            0% { transform: translateX(140px); }
            100% { transform: translateX(-140px); }
        }

        .logo-sphere {
            width: 96px;
            height: 96px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            position: relative;
        }

        .glow-pulse {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 20px;
            background: #006c49;
            filter: blur(20px);
            opacity: 0.05;
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.05; transform: scale(0.98); }
            50% { opacity: 0.12; transform: scale(1.05); }
        }
    </style>
</head>
<body class="bg-background text-on-background">
<main class="gradient-canvas">
<!-- Decorative Ambient Lights -->
<div class="absolute top-0 left-0 w-80 h-80 bg-secondary opacity-[0.03] rounded-full blur-[100px] pointer-events-none"></div>
<div class="absolute bottom-1/4 right-0 w-64 h-64 bg-primary opacity-[0.02] rounded-full blur-[80px] pointer-events-none"></div>
<!-- Branding Section -->
<div class="flex flex-col items-center justify-center z-10 floating-element">
<!-- Glass Logo Container -->
<div class="logo-sphere glass-container">
<div class="glow-pulse"></div>
<span class="material-symbols-outlined text-primary text-[48px] relative z-10" style="font-variation-settings: 'FILL' 1;">
                account_balance_wallet
            </span>
</div>
<!-- App Name -->
<h1 class="font-display-lg text-display-lg shimmer-text tracking-tight mb-2 text-primary">
            تتبع مصاريف العائلة
        </h1>
<!-- Tagline -->
<p class="font-body-md text-on-surface-variant tracking-wide opacity-70">
            إدارة ذكية لميزانية منزلك
        </p>
</div>
<!-- Loading Indicator -->
<div class="loading-bar-container">
<div class="loading-progress"></div>
</div>
<!-- Footer Text -->
<div class="absolute bottom-10">
<p class="font-label-md text-label-md text-outline/60 uppercase tracking-[1.5px] flex items-center gap-3">
<span class="font-bold">آمن</span>
<span class="w-1 h-1 rounded-full bg-secondary"></span>
<span class="font-bold">ذكي</span>
<span class="w-1 h-1 rounded-full bg-secondary"></span>
<span class="font-bold">عائلي</span>
</p>
</div>
</main>
<script>
    window.addEventListener('DOMContentLoaded', () => {
        const logo = document.querySelector('.logo-sphere');
        const text = document.querySelector('h1');
        const tagline = document.querySelector('p');
        const loader = document.querySelector('.loading-bar-container');
        const footer = document.querySelector('.absolute.bottom-10');

        // Set initial states
        [logo, text, tagline, loader, footer].forEach(el => {
            el.style.opacity = '0';
            el.style.transform = 'translateY(12px)';
            el.style.transition = 'all 0.8s cubic-bezier(0.16, 1, 0.3, 1)';
        });

        // Trigger orchestrated animations
        setTimeout(() => {
            logo.style.opacity = '1';
            logo.style.transform = 'translateY(0)';
        }, 200);

        setTimeout(() => {
            text.style.opacity = '1';
            text.style.transform = 'translateY(0)';
        }, 400);

        setTimeout(() => {
            tagline.style.opacity = '0.7';
            tagline.style.transform = 'translateY(0)';
        }, 600);

        setTimeout(() => {
            loader.style.opacity = '1';
            loader.style.transform = 'translateY(0)';
            footer.style.opacity = '1';
            footer.style.transform = 'translateY(0)';
        }, 800);
    });
</script>
</body></html>
